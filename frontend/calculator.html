<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">



    <script src="script.js" defer type="module"></script>
<body>
<div class="calculator">
    <div class="display" id="display"></div>
    <div class="control-matrix">
        <div class="buttons">
            <button id="btn1" class="button number">1</button>
            <button id="btn2" class="button number">2</button>
            <button id="btn3" class="button number">3</button>
            <button id="btnPlus" class="button operator">+</button>
        </div>
        <div>
            <button id="btn4" class="button number">4</button>
            <button id="btn5" class="button number">5</button>
            <button id="btn6" class="button number">6</button>
            <button id="btnMinus" class="button operator">-</button>
        </div>
        <div>
            <button id="btn7" class="button number">7</button>
            <button id="btn8" class="button number">8</button>
            <button id="btn9" class="button number">9</button>
            <button id="btnMultiply" class="button operator">*</button>
        </div>
        <div>
            <button id="btnClear" class="button action clear">C</button>
            <button id="btn0" class="button number">0</button>
            <button id="btnEquals" class="button action equals">=</button>
            <button id="btnDivide" class="button operator">/</button>
        </div>
    </div>
</div>
</body>
</html>
